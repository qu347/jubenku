sonar.projectKey=jubenku
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,backend/alembic,frontend/src
sonar.exclusions=frontend/src/__tests__/**
sonar.tests=backend/tests,frontend/src/__tests__
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/__tests__/**/*.ts

# Vue scoped CSS supports :deep(...); Sonar's generic CSS parser currently
# reports it as an unknown pseudo-class. Limit this exception to Vue SFCs.
sonar.issue.ignore.multicriteria=vueScopedDeep
sonar.issue.ignore.multicriteria.vueScopedDeep.ruleKey=css:S4659
sonar.issue.ignore.multicriteria.vueScopedDeep.resourceKey=frontend/src/**/*.vue
